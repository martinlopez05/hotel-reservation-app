server.port=${PAYMENTS_PORT:8005}
spring.application.name=msvc-payments

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/msvc-payments}
spring.datasource.username=${PAYMENTS_DB_USER:postgres}
spring.datasource.password=${PAYMENTS_DB_PASS:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${PAYMENTS_DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:TEST-TOKEN}
hotelfly.api.webhook-url=${HOTELFLY_WEBHOOK_URL:http://localhost:8005/payment/webhook}
hotelfly.frontend.url=${HOTEL_FLY_FRONTEND_URL:https://hotelfly.netlify.app}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

spring.cloud.loadbalancer.retry.enabled=true

springdoc.api-docs.path=/payment/v3/api-docs

spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=10000
spring.cloud.openfeign.client.config.default.retryer.enabled=true